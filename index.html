<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IMES - Coming Soon</title>
    <style>
        /* Reset and base styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 50%, #16213e 100%);
            color: #ffffff;
            overflow-x: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        /* Floating shapes animation */
        .floating-shape {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            animation: float 6s ease-in-out infinite;
        }
        .shape1 { width: 100px; height: 100px; top: 10%; left: 10%; animation-delay: 0s; }
        .shape2 { width: 80px; height: 80px; top: 20%; right: 15%; animation-delay: 2s; }
        .shape3 { width: 60px; height: 60px; bottom: 20%; left: 20%; animation-delay: 4s; }
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }
        /* Glowing lines */
        .glow-line {
            position: absolute;
            height: 2px;
            background: linear-gradient(90deg, transparent, #00d4ff, transparent);
            animation: glow 4s ease-in-out infinite;
        }
        .line1 { width: 200px; top: 30%; left: 5%; animation-delay: 1s; }
        .line2 { width: 150px; bottom: 40%; right: 10%; animation-delay: 3s; }
        @keyframes glow {
            0%, 100% { opacity: 0; transform: scaleX(0); }
            50% { opacity: 1; transform: scaleX(1); }
        }
        /* Animated particles */
        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #00d4ff;
            border-radius: 50%;
            animation: particle-move 8s linear infinite;
        }
        .particle:nth-child(1) { top: 50%; left: 50%; animation-delay: 0s; }
        .particle:nth-child(2) { top: 60%; left: 40%; animation-delay: 1s; }
        .particle:nth-child(3) { top: 40%; left: 60%; animation-delay: 2s; }
        @keyframes particle-move {
            0% { transform: translate(0, 0); opacity: 1; }
            100% { transform: translate(100px, -100px); opacity: 0; }
        }
        /* Main container */
        .container {
            text-align: center;
            z-index: 10;
            max-width: 600px;
            padding: 20px;
        }
        /* Logo/Name */
        .logo {
            font-size: 4rem;
            font-weight: bold;
            background: linear-gradient(45deg, #00d4ff, #0099cc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
            animation: neon-glow 2s ease-in-out infinite alternate;
        }
        @keyframes neon-glow {
            from { text-shadow: 0 0 10px #00d4ff; }
            to { text-shadow: 0 0 20px #00d4ff, 0 0 30px #00d4ff; }
        }
        /* Tagline */
        .tagline {
            font-size: 1.5rem;
            margin-bottom: 20px;
            opacity: 0.8;
        }
        /* Main message */
        .main-message {
            font-size: 2.5rem;
            margin-bottom: 10px;
            animation: fade-in 2s ease-in-out;
        }
        /* Sub-text */
        .sub-text {
            font-size: 1.2rem;
            margin-bottom: 30px;
            opacity: 0.7;
        }
        /* Countdown */
        .countdown {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
        }
        .countdown-item {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 10px;
            padding: 20px;
            min-width: 80px;
            transition: transform 0.3s ease;
        }
        .countdown-item:hover {
            transform: scale(1.1);
        }
        .countdown-number {
            font-size: 2rem;
            font-weight: bold;
        }
        .countdown-label {
            font-size: 0.8rem;
            opacity: 0.8;
        }
        /* Notify Me */
        .notify {
            margin-bottom: 30px;
        }
        .notify input {
            padding: 10px;
            border: none;
            border-radius: 5px;
            width: 250px;
            margin-right: 10px;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            transition: background 0.3s ease;
        }
        .notify input:focus {
            background: rgba(255, 255, 255, 0.2);
            outline: none;
        }
        .notify button {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            background: linear-gradient(45deg, #00d4ff, #0099cc);
            color: #fff;
            cursor: pointer;
            transition: transform 0.3s ease;
        }
        .notify button:hover {
            transform: scale(1.05);
        }
        /* Social Icons */
        .social {
            display: flex;
            justify-content: center;
            gap: 20px;
        }
        .social a {
            color: #00d4ff;
            font-size: 2rem;
            transition: color 0.3s ease;
        }
        .social a:hover {
            color: #fff;
        }
        /* Responsive */
        @media (max-width: 768px) {
            .logo { font-size: 3rem; }
            .main-message { font-size: 2rem; }
            .countdown { flex-direction: column; gap: 10px; }
            .notify input { width: 200px; }
        }
        /* Fade-in animation */
        @keyframes fade-in {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <!-- Floating shapes -->
    <div class="floating-shape shape1"></div>
    <div class="floating-shape shape2"></div>
    <div class="floating-shape shape3"></div>
    
    <!-- Glowing lines -->
    <div class="glow-line line1"></div>
    <div class="glow-line line2"></div>
    
    <!-- Animated particles -->
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    
    <!-- Main content -->
    <div class="container">
        <div class="logo">IMES</div>
        <div class="tagline">The Leader of Web</div>
        <div class="main-message">Coming Soon</div>
        <div class="sub-text">Under Maintenance. We are building something powerful for you.</div>
        
        <!-- Countdown Timer -->
        <div class="countdown">
            <div class="countdown-item">
                <div class="countdown-number" id="days">00</div>
                <div class="countdown-label">Days</div>
            </div>
            <div class="countdown-item">
                <div class="countdown-number" id="hours">00</div>
                <div class="countdown-label">Hours</div>
            </div>
            <div class="countdown-item">
                <div class="countdown-number" id="minutes">00</div>
                <div class="countdown-label">Minutes</div>
            </div>
            <div class="countdown-item">
                <div class="countdown-number" id="seconds">00</div>
                <div class="countdown-label">Seconds</div>
            </div>
        </div>
        
        <!-- Notify Me -->
        <div class="notify">
            <input type="email" placeholder="Enter your email" id="email">
            <button onclick="notifyMe()">Notify Me</button>
        </div>
        
        <!-- Social Icons -->
        <div class="social">
            <a href="#" title="Facebook"><i class="fab fa-facebook-f"></i></a>
            <a href="#" title="Twitter"><i class="fab fa-twitter"></i></a>
            <a href="#" title="Instagram"><i class="fab fa-instagram"></i></a>
            <a href="#" title="LinkedIn"><i class="fab fa-linkedin-in"></i></a>
        </div>
    </div>
    
    <script>
        // Countdown Timer (set target date, e.g., 30 days from now)
        const targetDate = new Date().getTime() + (30 * 24 * 60 * 60 * 1000); // 30 days
        
        function updateCountdown() {
            const now = new Date().getTime();
            const distance = targetDate - now;
            
            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);
            
            document.getElementById('days').innerText = days.toString().padStart(2, '0');
            document.getElementById('hours').innerText = hours.toString().padStart(2, '0');
            document.getElementById('minutes').innerText = minutes.toString().padStart(2, '0');
            document.getElementById('seconds').innerText = seconds.toString().padStart(2, '0');
            
            if (distance < 0) {
                clearInterval(countdownInterval);
                document.querySelector('.countdown').innerHTML = '<div class="countdown-item"><div class="countdown-number">00</div><div class="countdown-label">Launched!</div></div>';
            }
        }
        
        const countdownInterval = setInterval(updateCountdown, 1000);
        updateCountdown();
        
        // Notify Me function (simple alert for demo)
        function notifyMe() {
            const email = document.getElementById('email').value;
            if (email) {
                alert(`Thank you! We'll notify ${email} when IMES is ready.`);
                document.getElementById('email').value = '';
            } else {
                alert('Please enter a valid email.');
            }
        }
        
        // Add Font Awesome for social icons (if not loaded, icons won't show; in real use, include CDN)
        // For demo, assuming it's included; in production, add: <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    </script>
</body>
</html>
